; php2shell-guard — temporaere Mitigation fuer CVE-2026-109618 / CVE-2026-109619
; Fuer php-cgi SAPI. Hinweis: INI-Werte in PHP_INI_ALL (memory_limit,
; session.upload_progress.enabled) sind durch die Anwendung ueberschreibbar —
; hiermit werden nur CGI-Server ohne Pool-/Apache-Admin-Ebene abgesichert.
;
; Verwaltete Datei. Aenderungen werden bei erneutem Lauf ueberschrieben.
;
; Referenz: https://www.php.net/archive/2026.php#2026-10-21-5

memory_limit = -1
post_max_size = @POST_MAX@
upload_max_filesize = @UPLOAD_MAX@
session.upload_progress.enabled = 0
fatal_error_backtraces = @FATAL_BACKTRACES@
max_input_nesting_level = @MAX_NESTING@
max_input_vars = @MAX_INPUT_VARS@
max_file_uploads = @MAX_FILE_UPLOADS@

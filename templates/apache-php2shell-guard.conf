# php2shell-guard — temporaere Mitigation fuer CVE-2026-109618 / CVE-2026-109619
# Verwaltete Datei. Aenderungen werden bei erneutem Lauf ueberschrieben.
#
# Zweck: Admin-level (nicht durch die Anwendung ueberschreibbare) PHP-Konfiguration,
# damit die OOM-/Stale-State-Pfade der PHP2Shell-Luecke nicht ausgeloest werden.
# Diese Massnahmen sind NOTVLOESUNGEN — das Update auf eine gepatchte PHP-Version
# bleibt zwingend erforderlich.
#
# Referenz: https://www.php.net/archive/2026.php#2026-10-21-5

<IfModule mod_php.c>
    # CVE-2026-109618: Speicherlimit administrativ fixieren (OOM-Pfad entschaerfen)
    php_admin_value memory_limit -1

    # Request-Groessen begrenzen
    php_admin_value post_max_size @POST_MAX@
    php_admin_value upload_max_filesize @UPLOAD_MAX@

    # CVE-2026-109619: Producer fuer stale State abschalten
    php_admin_value session.upload_progress.enabled 0
    php_admin_value fatal_error_backtraces @FATAL_BACKTRACES@

    # Eingabe-Komplexitaet begrenzen
    php_admin_value max_input_nesting_level @MAX_NESTING@
    php_admin_value max_input_vars @MAX_INPUT_VARS@
    php_admin_value max_file_uploads @MAX_FILE_UPLOADS@
</IfModule>

# Harte Request-Limits auf Webserver-Ebene (greift vor dem PHP-Parser)
LimitRequestBody @LIMIT_REQUEST_BODY@
LimitRequestFields @LIMIT_REQUEST_FIELDS@
LimitRequestFieldSize @LIMIT_REQUEST_FIELD_SIZE@

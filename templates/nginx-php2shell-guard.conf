# php2shell-guard — temporaere Mitigation fuer CVE-2026-109618 / CVE-2026-109619
# nginx-Gegenstueck: Body-Groesse und Zeitlimits auf Proxy-Ebene.
# Hinweis: nginx kann Multipart-Teilanzahl/Headeranzahl nicht nativ begrenzen —
# dafuer wird ein WAF (ModSecurity/NAXSI) oder eine Application-Gateway-Regel benoetigt.
#
# Verwaltete Datei. Aenderungen werden bei erneutem Lauf ueberschrieben.
#
# Referenz: https://www.php.net/archive/2026.php#2026-10-21-5

client_max_body_size @POST_MAX@;
client_body_buffer_size 256k;
client_body_timeout 30s;
client_header_timeout 30s;

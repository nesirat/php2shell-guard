name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testsuite
        run: ./tests/run-tests.sh

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x -S warning bin/php2shell-guard bin/php2shell-fleet lib/*.sh tools/*.sh tests/run-tests.sh

      - name: shfmt
        run: |
          sudo apt-get install -y shfmt
          shfmt -d -i 0 -ci bin/ lib/ tools/ tests/

      - name: Bundle baut und laeuft
        run: |
          ./tools/build-bundle.sh
          # Exit 2 ist ein Befund (ungepatchtes PHP auf dem Runner), kein Werkzeugfehler.
          rc=0
          bash dist/php2shell-guard.sh scan --json || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          bash dist/php2shell-guard.sh templates all > /dev/null

  scan-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Eigenes Repository scannen
        run: |
          ./tools/build-bundle.sh
          rc=0
          bash dist/php2shell-guard.sh scan --json || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
